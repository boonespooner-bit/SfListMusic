name: Stamp asset versions

# Cloudflare and browsers cache app.js / style.css by filename, so index.html
# references them as app.js?v=<hash>. This keeps that hash in step with the
# files' contents so every change reaches visitors immediately.

on:
  push:
    paths: ['public/app.js', 'public/style.css']
  workflow_dispatch:

jobs:
  stamp:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Update ?v= hashes in index.html
        run: |
          js=$(sha256sum public/app.js | cut -c1-10)
          css=$(sha256sum public/style.css | cut -c1-10)
          sed -i -E "s#app\.js(\?v=[^\"]*)?\"#app.js?v=${js}\"#; s#style\.css(\?v=[^\"]*)?\"#style.css?v=${css}\"#" public/index.html
          grep -nE 'app\.js|style\.css' public/index.html

      - name: Commit if changed
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add public/index.html
          if git diff --staged --quiet; then
            echo "Already up to date"
          else
            git commit -m "chore: stamp asset versions"
            git pull --rebase
            git push
          fi
